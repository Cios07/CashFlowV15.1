<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8EF7"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F8EF7"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1B1F5E" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- chèque -->
  <g filter="url(#shadow)">
    <rect x="82" y="138" width="348" height="226" rx="34" fill="#FFFFFF"/>
  </g>
  <rect x="122" y="182" width="112" height="18" rx="9" fill="#C9D6FF"/>
  <rect x="122" y="218" width="188" height="18" rx="9" fill="#DDE5FF"/>
  <rect x="352" y="182" width="48" height="18" rx="9" fill="#C9D6FF"/>
  <!-- flux -->
  <path d="M122 318 C 160 280, 198 350, 242 316 S 316 282, 352 312" fill="none"
